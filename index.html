<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グリーンアース</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">

    <!-- ヘッダー -->
    <header class="bg-white shadow px-6 py-4">
      <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-green-700">松丘商業高等学校</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
          <a href="#" class="text-gray-700 hover:text-green-600">ホーム</a>
          <a href="#" class="text-gray-700 hover:text-green-600">シラバス</a>
          <a href="#" class="text-gray-700 hover:text-green-600">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <!-- メイン -->
    <main class="max-w-4xl mx-auto px-6 py-10">

      <!-- ヒーローエリア -->
      <section class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">商業という言語を学ぶ。</h2>
        <p class="text-gray-600">私たちは商業という言語を学び、世界に通用するビジネスパーソンを育成します。</p>
      </section>

      <!-- 活動内容カード -->
      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">取得可能な資格</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:scale-105 hover:text-green-600 transition">
            <p class="text-2xl mb-2">📚</p>
            <h3 class="font-bold">日商簿記2級</h3>
            <p class="text-gray-500 text-sm mt-1">社会に出ても重宝される会計知識を証明できます。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:scale-105 hover:text-green-600 transition">
            <p class="text-2xl mb-2">💻</p>
            <h3 class="font-bold">ITパスポート</h3>
            <p class="text-gray-500 text-sm mt-1">ITスキルを証明する国家資格です。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:scale-105 hover:text-green-600 transition">
            <p class="text-2xl mb-2">🏫</p>
            <h3 class="font-bold">全商検定 全9種目</h3>
            <p class="text-gray-500 text-sm mt-1">全国商業高等学校主催の検定全9種目の合格を目指せます。</p>
          </div>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="bg-green-800 text-white text-sm text-center py-6">
      &copy; 2025 グリーンアース
    </footer>

  </body>
</html>
